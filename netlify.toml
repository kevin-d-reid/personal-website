[[redirects]]
  from = "https://kdr-personal-website.netlify.app/*"
  to = "https://kevindreid.ca/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://kevindreid.com/*"
  to = "https://kevindreid.ca/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.kevindreid.com/*"
  to = "https://kevindreid.ca/:splat"
  status = 301
  force = true

[context.production]
  command = "npm run build && cp ./custom-headers/_productionHeaders.txt ./dist/_headers"